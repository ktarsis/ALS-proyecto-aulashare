{% extends 'base.html' %}
{% block title %}{{ 'Editar asignatura' if subject else 'Nueva asignatura' }} - AulaShare{% endblock %}
{% block content %}
<section class="form-shell wide">
  <article>
    <h1>{{ 'Editar asignatura' if subject else 'Nueva asignatura' }}</h1>
    <form method="post">
      <label>Nombre
        <input type="text" name="name" value="{{ subject.name if subject else '' }}" minlength="3" required>
      </label>
      <label>Grado / categoria
        <input type="text" name="degree" value="{{ subject.degree if subject else '' }}" required>
      </label>
      <label>Curso
        <input type="text" name="course" value="{{ subject.course if subject else '' }}" required>
      </label>
      <label>Descripcion
        <textarea name="description" rows="5">{{ subject.description if subject else '' }}</textarea>
      </label>
      <button type="submit">Guardar</button>
    </form>
  </article>
</section>
{% endblock %}
